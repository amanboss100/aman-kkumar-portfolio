<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Aman Kumar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .form-group { margin-bottom: 20px; }
        input, select, textarea { 
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            background: var(--bg); color: var(--text); font-family: var(--font-main);
            box-shadow: var(--shadow-in); outline: none; font-size: 1rem;
        }
        input:focus, select:focus, textarea:focus { box-shadow: var(--shadow-out); }
        
        /* BIG 3D Checkbox */
        .custom-checkbox-wrapper { display: flex; align-items: center; gap: 15px; cursor: pointer; margin-top: 25px; margin-bottom: 25px; font-weight: 600; color: var(--text-soft); user-select: none; }
        .custom-checkbox-wrapper input { display: none; }
        .checkmark { width: 35px; height: 35px; background: var(--surface); border-radius: 10px; box-shadow: var(--shadow-out); display: flex; align-items: center; justify-content: center; transition: var(--transition); color: transparent; font-size: 1.4rem; }
        .custom-checkbox-wrapper input:checked + .checkmark { box-shadow: var(--shadow-in); color: var(--cyan); }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" style="text-decoration: none; color: var(--text); font-weight: bold; font-size: 1.2rem;">AK.</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </div>
        <button id="themeToggle">☀️</button>
    </nav>

    <!-- Contact Form Section -->
    <div class="container" style="max-width: 600px;">
        <div class="card">
            <h2 style="font-size: 2.2rem; margin-bottom: 10px;">Let's <span style="color: var(--cyan);">Connect</span></h2>
            <p style="margin-bottom: 30px;">Have an idea or want to collaborate? Send me a message below.</p>

            <form id="contactForm">
                <!-- Replace with your actual Web3Forms Access Key -->
                <input type="hidden" name="access_key" value="a7239474-1998-424b-b510-bb1e5192bba4">
                <input type="hidden" name="subject" value="New Portfolio Inquiry — Aman Kumar">
                <input type="checkbox" name="botcheck" style="display: none;">

                <div class="form-group">
                    <input type="text" name="name" placeholder="Your Name *" required>
                </div>
                
                <div class="form-group">
                    <input type="email" name="email" placeholder="Your Email *" required>
                </div>

                <div class="form-group">
                    <select name="project_type" required>
                        <option value="" disabled selected>Reason for Contact *</option>
                        <option value="Project">Project Idea</option>
                        <option value="Collaboration">Collaboration</option>
                        <option value="Internship">Internship Opportunity</option>
                        <option value="Just Connect">Just to Connect</option>
                    </select>
                </div>

                <div class="form-group">
                    <textarea name="message" rows="5" placeholder="Tell me about your idea... *" required></textarea>
                </div>

                <!-- 3D Checkbox -->
                <label class="custom-checkbox-wrapper">
                    <input type="checkbox" name="consent" id="consent" required>
                    <div class="checkmark">✔</div>
                    <span>I agree to be contacted regarding this message.</span>
                </label>

                <button type="submit" id="submitBtn" class="btn" style="width: 100%;">Send Message ↗</button>
                <div id="formStatus" style="text-align: center; margin-top: 15px; font-weight: bold;"></div>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
    <script>
        // Specific Contact Form Logic
        const contactForm = document.getElementById("contactForm");
        const submitBtn = document.getElementById("submitBtn");
        const formStatus = document.getElementById("formStatus");

        if (contactForm) {
            contactForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                submitBtn.textContent = "Sending...";
                submitBtn.disabled = true;

                const formData = new FormData(contactForm);
                try {
                    const response = await fetch("https://api.web3forms.com/submit", {
                        method: "POST",
                        body: formData,
                        headers: { 'Accept': 'application/json' }
                    });
                    
                    const result = await response.json();
                    if (response.ok && result.success) {
                        formStatus.innerHTML = "<span style='color: var(--cyan);'>Message sent successfully! I'll reply soon.</span>";
                        contactForm.reset();
                    } else {
                        throw new Error("Something went wrong");
                    }
                } catch (error) {
                    formStatus.innerHTML = "<span style='color: #ff4757;'>Error sending message. Try again later.</span>";
                } finally {
                    submitBtn.textContent = "Send Message ↗";
                    submitBtn.disabled = false;
                }
            });
        }
    </script>
</body>
</html>
